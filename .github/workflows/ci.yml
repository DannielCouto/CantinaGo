name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build, unit, integration, Cucumber)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for SonarQube blame
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test (Surefire + Failsafe/Testcontainers + Cucumber)
        run: mvn -B verify
      - name: SonarQube Cloud analysis
        if: env.SONAR_TOKEN != ''
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=cantinago-backend
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/cucumber
            backend/target/site/jacoco-merged

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build

  stack:
    name: Walking skeleton smoke test (Docker Compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Frontend -> backend -> database
        run: curl -fs http://localhost:8000/api/stations | grep -q "Cantina do Crasto"
      - name: Simulator -> broker -> backend -> database
        run: |
          for i in $(seq 1 20); do
            n=$(docker compose exec -T db psql -U cantinago -tAc \
                "select count(*) from ebikes where last_telemetry_at is not null")
            [ "$n" -gt 0 ] && echo "telemetry applied to $n e-bikes" && exit 0
            sleep 3
          done
          echo "no telemetry received"; exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  xray:
    name: Import test results into Xray
    # One Test Execution per push to main, so PR runs don't flood Jira.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: backend
    env:
      XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
      XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
      XRAY_URL: https://xray.cloud.getxray.app/api/v2
      JIRA_PROJECT: SCRUM
    steps:
      - name: Skip when Xray credentials are not configured
        if: env.XRAY_CLIENT_ID == ''
        run: echo "XRAY_CLIENT_ID/XRAY_CLIENT_SECRET not set; skipping import."
      - uses: actions/checkout@v7
        if: env.XRAY_CLIENT_ID != ''
      - uses: actions/download-artifact@v8
        if: env.XRAY_CLIENT_ID != ''
        with:
          name: backend-test-reports
          path: reports
      - name: Authenticate
        if: env.XRAY_CLIENT_ID != ''
        run: |
          token=$(curl -fsS -H "Content-Type: application/json" -X POST \
            --data "{\"client_id\":\"$XRAY_CLIENT_ID\",\"client_secret\":\"$XRAY_CLIENT_SECRET\"}" \
            "$XRAY_URL/authenticate" | tr -d '"')
          echo "::add-mask::$token"
          echo "XRAY_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Import feature files (creates or updates the Xray Tests)
        if: env.XRAY_CLIENT_ID != ''
        run: |
          # Results can only be matched to existing Tests, so sync the scenarios first.
          # The response lists the Test keys; tag each scenario with its key (AGENTS.md).
          (cd backend/src/test/resources/features && zip -qr "$GITHUB_WORKSPACE/features.zip" .)
          curl -sS --fail-with-body -H "Authorization: Bearer $XRAY_TOKEN" -X POST \
            -F "file=@features.zip" \
            "$XRAY_URL/import/feature?projectKey=$JIRA_PROJECT"
      - name: Import Cucumber results (acceptance tests)
        if: env.XRAY_CLIENT_ID != ''
        run: |
          cat > info.json <<JSON
          {"fields": {
            "project": {"key": "$JIRA_PROJECT"},
            "summary": "CI acceptance tests - ${GITHUB_SHA::7}",
            "description": "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID",
            "issuetype": {"name": "Test Execution"}
          }}
          JSON
          curl -sS --fail-with-body -H "Authorization: Bearer $XRAY_TOKEN" -X POST \
            -F "results=@reports/cucumber/cucumber.json" -F "info=@info.json" \
            "$XRAY_URL/import/execution/cucumber/multipart"
      - name: Import JUnit results (unit and integration tests)
        if: env.XRAY_CLIENT_ID != ''
        run: |
          # Xray takes one JUnit file per request: merge the per-class Surefire/Failsafe reports.
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          root = ET.Element("testsuites")
          for f in sorted(glob.glob("reports/surefire-reports/TEST-*.xml") + glob.glob("reports/failsafe-reports/TEST-*.xml")):
              suite = ET.parse(f).getroot()
              if "CucumberIT" not in suite.get("name", ""):  # already imported as Cucumber
                  root.append(suite)
          ET.ElementTree(root).write("junit.xml", encoding="utf-8", xml_declaration=True)
          PY
          curl -sS --fail-with-body -H "Authorization: Bearer $XRAY_TOKEN" -H "Content-Type: text/xml" -X POST \
            --data-binary @junit.xml "$XRAY_URL/import/execution/junit?projectKey=$JIRA_PROJECT"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
