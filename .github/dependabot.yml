version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    target-branch: dev
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    target-branch: dev
  - package-ecosystem: pip
    directory: /simulator
    schedule: { interval: weekly }
    target-branch: dev
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: dev
